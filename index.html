<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astoria - Accueil</title>
    <meta name="description" content="Astoria : univers de jeu de rôle, royaumes et glossaire.">
    <link rel="icon" type="image/x-icon" href="assets/images/ALICE_ACADEMIA.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="min-h-screen">
    <main class="home-page" id="haut">
        <header class="home-panel home-hero">
            <div>
                <p class="home-kicker" id="homeKicker">Alice Academia</p>
                <h1 class="home-title" id="homeTitle">Astoria</h1>
                <p class="home-tagline" id="homeTagline"></p>
                <p class="home-text" id="homeText" hidden></p>
            </div>
            <div class="home-actions" id="homeActions">
                <a class="home-btn" href="html/login.html" id="homePrimaryAction">Se connecter</a>
                <a class="home-btn home-btn--ghost" href="#glossaire">Glossaire</a>
            </div>
        </header>

        <section class="home-panel" id="royaumes" aria-labelledby="royaumesTitle">
            <h2 class="home-section-title" id="royaumesTitle">Royaumes</h2>
            <div class="home-kingdoms" id="homeKingdoms"></div>
        </section>

        <section class="home-panel" id="glossaire" aria-labelledby="glossaireTitle">
            <h2 class="home-section-title" id="glossaireTitle">Glossaire</h2>
            <div class="home-glossary-tools">
                <label class="sr-only" for="glossarySearch">Rechercher un terme</label>
                <input class="home-search" id="glossarySearch" type="search" placeholder="Rechercher un terme…" autocomplete="off">
                <div class="home-chips" id="glossaryKingdoms" role="group" aria-label="Filtrer par royaume"></div>
                <div class="home-chips" id="glossaryCategories" role="group" aria-label="Filtrer par catégorie"></div>
                <nav class="home-letters" id="glossaryLetters" aria-label="Index alphabétique"></nav>
                <p class="home-count" id="glossaryCount" aria-live="polite">Chargement…</p>
            </div>
            <div id="glossaryResults"></div>
        </section>
    </main>

    <script type="module" src="js/public/public-nav.js"></script>
    <script type="module" src="js/public/home.js"></script>
    <script type="module">
        // Logged-in players get a direct way back to their characters.
        import { readSession } from './js/api/session-store.js';
        try {
            if (readSession()?.user?.id) {
                const action = document.getElementById('homePrimaryAction');
                action.href = 'html/personnages.html';
                action.textContent = 'Mes personnages';
            }
        } catch {}
    </script>
</body>
</html>
